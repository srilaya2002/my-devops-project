---
# Install MSSQL Server on Linux

- name: Install required dependencies
  yum:
    name:
      - curl
      - wget
      - gnupg
      - libsodium
      - rsync
    state: present
  tags:
    - install
    - dependencies

- name: Add Microsoft SQL Server repository key
  rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present
  tags:
    - install
    - repo

- name: Add Microsoft SQL Server repository
  yum_repository:
    name: mssql-server
    description: Microsoft SQL Server Repository
    baseurl: https://packages.microsoft.com/rhel/8/mssql-server-{{ mssql_version }}/
    gpgcheck: yes
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    enabled: yes
  tags:
    - install
    - repo

- name: Add Microsoft MSSQL-Tools repository
  yum_repository:
    name: mssql-tools
    description: Microsoft MSSQL-Tools Repository
    baseurl: https://packages.microsoft.com/rhel/8/prod/
    gpgcheck: yes
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    enabled: yes
  tags:
    - install
    - repo

- name: Install MSSQL Server
  yum:
    name: mssql-server
    state: present
  tags:
    - install
    - mssql

- name: Install MSSQL Tools (sqlcmd)
  yum:
    name: mssql-tools
    state: present
  environment:
    ACCEPT_EULA: "Y"
  tags:
    - install
    - tools

- name: Check whether MSSQL Server is already active and licensed
  # NOTE: checking for /var/opt/mssql/mssql.conf here used to cause setup to be
  # skipped -- the RPM package creates that file on install, before the EULA/SA
  # password setup has ever run, which left mssql-server crash-looping with
  # "EULA must be accepted" and never opening the SQL port. Checking the actual
  # service state is a reliable signal that setup has genuinely completed.
  command: systemctl is-active mssql-server
  register: mssql_service_active
  failed_when: false
  changed_when: false
  tags:
    - install
    - setup

- name: Run MSSQL setup/configuration (accepts EULA, sets SA password)
  shell: |
    MSSQL_SA_PASSWORD='{{ sa_password }}' \
    MSSQL_PID='{{ mssql_edition }}' \
    /opt/mssql/bin/mssql-conf -n setup accept-eula
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: "{{ sa_password }}"
    MSSQL_PID: "{{ mssql_edition }}"
  when: mssql_service_active.stdout | trim != 'active'
  tags:
    - install
    - setup

- name: Enable MSSQL Server service
  systemd:
    name: mssql-server
    enabled: yes
    state: started
  tags:
    - install
    - service

- name: Wait for SQL Server to start
  wait_for:
    port: "{{ mssql_port }}"
    delay: 10
    timeout: 120
  tags:
    - install
    - service

- name: Verify MSSQL installation
  shell: |
    {{ mssql_tools_path }}/sqlcmd -S localhost -U SA -P "{{ sa_password }}" -Q "SELECT @@VERSION"
  register: version_check
  changed_when: false
  tags:
    - install
    - verify

- name: Display MSSQL version
  debug:
    var: version_check.stdout
  tags:
    - install
    - verify
