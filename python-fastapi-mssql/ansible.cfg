[defaults]
log_path = ./logs/ansible.log
host_key_checking = False
# forks=1: this lab's VMware Fusion custom network (vmnet2) drops connections
# when Ansible opens SSH to vm1 and vm2 at the same time (confirmed via
# --limit vm1 succeeding end-to-end while the unlimited two-host run
# consistently failed with "No route to host" at the TCP connect() stage).
# Forcing one host at a time avoids that race entirely.
forks = 1

[ssh_connection]
# The vmnet2 bridge on this host intermittently drops the very first TCP
# SYN to a VM (fails instantly with "No route to host") even when ping and
# a retried connection succeed seconds later -- a software-bridge MAC/ARP
# relearning quirk, not a real routing problem. Retrying absorbs those
# transient blips instead of failing the whole play.
retries = 5

