[defaults]
log_path = ./logs/ansible.log
host_key_checking = False
# Same VMware Fusion host-networking flakiness seen on the MSSQL lab's vmnet
# (confirmed there via --limit testing; carrying the same defensive settings
# here since it's the same host, a different vmnet/subnet for these VMs).
forks = 1

[ssh_connection]
retries = 5
