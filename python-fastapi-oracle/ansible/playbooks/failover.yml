---
# Standalone -- not part of site.yml. Run with --limit against the single
# surviving standby that should become the new primary (the real primary
# is assumed down/unreachable already):
#   ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/failover.yml --limit oracle_standby
- name: Trigger a real Data Guard Broker failover
  hosts: oracle_servers
  become: true
  gather_facts: true
  tasks:
    - name: Run failover tasks
      include_role:
        name: oracle_broker
        tasks_from: failover.yml
      tags:
        - failover
