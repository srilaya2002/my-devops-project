---
# Redo transport -- LOG_ARCHIVE_CONFIG must be set on BOTH databases or you
# get ORA-16047 (DGID mismatch). Both sides now use SCOPE=BOTH: primary has
# always had an spfile (DBCA default), and the standby does too since
# spfile_conversion.yml runs before this. (Earlier, before that conversion
# existed, the standby ran off a plain pfile and this had to use
# SCOPE=MEMORY instead -- SCOPE=BOTH failed there with ORA-32001, "write to
# SPFILE requested but no SPFILE is in use".)

- name: Check current LOG_ARCHIVE_CONFIG on primary
  shell: |
    sqlplus -s / as sysdba <<EOSQL
    set heading off feedback off pagesize 0 verify off
    SELECT value FROM v\$parameter WHERE name = 'log_archive_config';
    exit;
    EOSQL
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ primary_sid }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_env.PATH }}"
  register: primary_log_archive_config_check
  changed_when: false
  when: inventory_hostname == primary_host

- name: Set LOG_ARCHIVE_CONFIG and LOG_ARCHIVE_DEST_2 on primary
  shell: |
    sqlplus -s / as sysdba <<EOSQL
    ALTER SYSTEM SET LOG_ARCHIVE_CONFIG='DG_CONFIG=({{ primary_db_unique_name }},{{ standby_db_unique_name }})' SCOPE=BOTH;
    ALTER SYSTEM SET LOG_ARCHIVE_DEST_2='SERVICE={{ standby_db_unique_name }} ASYNC VALID_FOR=(ONLINE_LOGFILES,PRIMARY_ROLE) DB_UNIQUE_NAME={{ standby_db_unique_name }}' SCOPE=BOTH;
    ALTER SYSTEM SET LOG_ARCHIVE_DEST_STATE_2=ENABLE SCOPE=BOTH;
    exit;
    EOSQL
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ primary_sid }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_env.PATH }}"
  when:
    - inventory_hostname == primary_host
    - standby_db_unique_name not in primary_log_archive_config_check.stdout

- name: Check current LOG_ARCHIVE_CONFIG on standby
  shell: |
    sqlplus -s / as sysdba <<EOSQL
    set heading off feedback off pagesize 0 verify off
    SELECT value FROM v\$parameter WHERE name = 'log_archive_config';
    exit;
    EOSQL
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ standby_sid }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_env.PATH }}"
  register: standby_log_archive_config_check
  changed_when: false
  when: inventory_hostname == standby_host

- name: Set LOG_ARCHIVE_CONFIG on standby
  shell: |
    sqlplus -s / as sysdba <<EOSQL
    ALTER SYSTEM SET LOG_ARCHIVE_CONFIG='DG_CONFIG=({{ primary_db_unique_name }},{{ standby_db_unique_name }})' SCOPE=BOTH;
    exit;
    EOSQL
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ standby_sid }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_env.PATH }}"
  when:
    - inventory_hostname == standby_host
    - primary_db_unique_name not in standby_log_archive_config_check.stdout
