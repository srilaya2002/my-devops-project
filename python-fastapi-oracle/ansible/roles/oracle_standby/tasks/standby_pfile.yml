---
# Standby pfile + nomount startup.
#
# The template deploy is gated on the file not already existing -- NOT
# unconditional. Earlier this overwrote a real, working, hand-tuned
# init.ora with this role's reconstructed template on every run. It caused
# no visible harm at the time (the already-running instance just kept
# using its in-memory config and ignored the file on disk), but it baked a
# real bug (missing db_recovery_file_dest) back in, invisibly, until a
# later CREATE SPFILE FROM PFILE read that stale file and failed at
# STARTUP MOUNT. Never deploy this template over a file that already
# exists.

- name: Check whether a standby init.ora already exists
  stat:
    path: "{{ oracle_home }}/dbs/init{{ standby_sid }}.ora"
  register: standby_initora_stat
  when: inventory_hostname == standby_host

- name: Deploy the standby's init.ora (first run only -- never overwrites an existing one)
  template:
    src: init_standby.ora.j2
    dest: "{{ oracle_home }}/dbs/init{{ standby_sid }}.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'
  become: true
  when:
    - inventory_hostname == standby_host
    - not standby_initora_stat.stat.exists

- name: Check whether the standby instance is already started (nomount or further)
  shell: |
    echo "exit;" | sqlplus -s / as sysdba
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ standby_sid }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_env.PATH }}"
  register: standby_instance_check
  changed_when: false
  failed_when: false
  when: inventory_hostname == standby_host

- name: Start the standby instance in NOMOUNT (first run only)
  shell: |
    sqlplus -s / as sysdba <<EOSQL
    STARTUP NOMOUNT PFILE='{{ oracle_home }}/dbs/init{{ standby_sid }}.ora';
    exit;
    EOSQL
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: "{{ standby_sid }}"
    PATH: "{{ oracle_home }}/bin:{{ ansible_env.PATH }}"
  when:
    - inventory_hostname == standby_host
    - standby_instance_check.rc != 0
