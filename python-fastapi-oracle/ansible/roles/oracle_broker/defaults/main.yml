---
oracle_home: /opt/oracle/product/19c/dbhome_1
oracle_user: oracle
oracle_group: oinstall

primary_sid: ORCLCDB
standby_sid: ORCLCDB
primary_db_unique_name: ORCLCDB
standby_db_unique_name: ORCLCDB_STBY
primary_host: oracle_primary
standby_host: oracle_standby

primary_datafile_dir: /opt/oracle/oradata/ORCLCDB
standby_datafile_dir: /opt/oracle/oradata/ORCLCDB_STBY

# Must match oracle_primary/oracle_standby roles' sys_password -- same
# database, same user.
sys_password: "OraclePwd_19c"

broker_config_name: dg_config

# Oracle convention: one more standby redo log group than the number of
# online redo log groups per thread. This lab's primary has 3 online
# groups (1-3), so standby logs start at group 4 and run through 7.
standby_redo_log_size: 200M
standby_redo_log_start_group: 4
standby_redo_log_count: 4
